services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: plantpulse
      POSTGRES_PASSWORD: plantpulse
      POSTGRES_DB: plantpulse
    ports:
      - "5439:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plantpulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    ports:
      - "8009:8009"
    environment:
      DATABASE_URL: postgresql+psycopg://plantpulse:plantpulse@db:5432/plantpulse
      JWT_SECRET: dev-secret-change-in-production
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8009"

  frontend:
    build: ./frontend
    ports:
      - "3009:80"
    depends_on:
      - api

volumes:
  pgdata:
